# Site-wide settings. Passed to pandoc on every build, so every page can use them.
# Page frontmatter overrides anything set here.

# Your production URL, no trailing slash. Used for canonical links, og:url, and sitemap.xml.
url: https://stephenturner.github.io/markdown-homepage

# Shown in og:site_name and in the JSON-LD block on the homepage.
site-name: Jerry the Cat

# Optional. Image used for link previews (og:image, twitter:image) on pages that don't set their own `image`.
# Path is relative to the site root. Use a JPG or PNG, ideally 1200x630 or square.
social-image: files/headshot.jpg

# Optional. Your GoatCounter code (the part before .goatcounter.com). Delete the line for no analytics.
# goatcounter: your-code

# Optional. Structured data for search engines, emitted on the page with `home: true`.
# Values are pasted into JSON as-is, so avoid double quotes inside them. 
# Update the values to match your own site and social/github/linkedin/etc profiles.
person:
  name: Jerry the Cat
  job-title: Persian Cat
  same-as:
    - https://github.com/stephenturner
    - https://www.linkedin.com/in/turnersd/
  employer: Stephen Turner
  employer-url: https://stephenturner.us/
